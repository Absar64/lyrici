<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Connecting…</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-veil"></div>
  <main class="shell">
    <div class="notice">
      <p class="notice__lead" id="msg">Connecting…</p>
    </div>
  </main>
  <script type="module">
    import { exchangeCode } from "./auth.js";
    const params = new URLSearchParams(location.search);
    const msg = document.getElementById("msg");
    (async () => {
      if (params.get("error")) {
        msg.textContent = "Spotify declined the request.";
        return;
      }
      try {
        await exchangeCode(params.get("code"));
        location.replace("./");
      } catch (err) {
        msg.textContent = err.message;
      }
    })();
  </script>
</body>
</html>
